      <rect x="-132" y="-40" width="42" height="80" rx="12" fill="rgba(255,122,26,.12)" stroke="#ff7a1a" stroke-width="4"/>
      <rect x="90" y="-40" width="42" height="80" rx="12" fill="rgba(255,122,26,.12)" stroke="#ff7a1a" stroke-width="4"/>
      <path d="M-52 0H52" stroke="#ff7a1a" stroke-width="10" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="16" fill="#ff7a1a"/>
      <circle cx="0" cy="0" r="7" fill="#0b0d12"/>
      <path d="M-52 -52V52M52 -52V52" stroke="rgba(255,255,255,.28)" stroke-width="6" stroke-linecap="round"/>
