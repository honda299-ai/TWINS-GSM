<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <script src="theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TWINS GSM — لوحة التحكم</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#08090b" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="admin.css" />
  <link rel="stylesheet" href="modern.css" />
</head>
<body class="admin-body">

  <!-- Login -->
  <section class="login-wrap" id="loginView">
    <form class="login-card" id="loginForm">
      <div class="login-logo">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i></span>
        <div><strong>TWINS <em>GSM</em></strong><small>ADMIN PANEL</small></div>
      </div>
      <h1>لوحة التحكم</h1>
      <p>سجّل الدخول بحساب الأدمن أو حساب شريك معتمد.</p>

      <button type="button" class="btn-google" id="adminGoogle">الدخول بحساب Google</button>
      <div class="auth-divider"><span>أو بالبريد</span></div>
      <label>الإيميل
        <input type="email" id="adminEmail" autocomplete="username" required placeholder="name@example.com" />
      </label>
      <label>كلمة المرور
        <span class="pass-wrap">
          <input type="password" id="adminPassword" autocomplete="current-password" required placeholder="••••••••" />
          <button type="button" class="pass-toggle" id="passToggle">إظهار</button>
        </span>
      </label>
      <button class="btn btn-primary btn-block" type="submit" id="loginBtn">دخول ←</button>
      <p class="login-error" id="loginError" role="alert" hidden></p>
      <p class="login-ok" id="loginOk" role="status" hidden></p>
      
      <div class="login-links">
        <button type="button" class="link-btn" id="forgotBtn">نسيت كلمة المرور؟</button>
        <a class="back-link" href="index.html">← الرجوع للموقع</a>
      </div>
    </form>
  </section>

  <!-- Dashboard -->
  <div class="admin-shell" id="adminView" hidden>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <aside class="admin-sidebar" id="adminSidebar">
      <div class="sidebar-brand">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i></span>
        <div><strong>TWINS <em>GSM</em></strong><small>ADMIN PANEL</small></div>
      </div>
      <nav class="admin-nav" id="adminNav" aria-label="أقسام لوحة التحكم"></nav>
      <div class="sidebar-bottom">
        <a href="index.html" target="_blank" rel="noopener">عرض الموقع ↗</a>
        <button type="button" id="logoutBtn">تسجيل خروج</button>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <div class="topbar-title">
          <button class="menu-toggle" id="adminMenuToggle" aria-label="فتح القائمة" aria-expanded="false"><span></span><span></span><span></span></button>
          <div>
            <span class="section-label" id="pageCrumb">لوحة التحكم</span>
            <h1 id="pageTitle">نظرة عامة</h1>
          </div>
        </div>
        <div class="topbar-actions">
          <a class="btn btn-ghost btn-sm hide-sm" href="index.html" target="_blank" rel="noopener">معاينة الموقع ↗</a>
          <span class="user-pill" id="userEmail">—</span>
        </div>
      </header>

      <section class="admin-content" id="adminContent"></section>
    </main>
  </div>

  <!-- Shared overlays -->
  <div class="modal" id="modal" hidden role="dialog" aria-modal="true">
    <div class="modal-box" id="modalBox"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <script src="firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/13.4.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/13.4.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/13.4.0/firebase-firestore-compat.js"></script>

  <script src="data.js"></script>
  <script src="admin.js"></script>
  <script src="admin-content.js"></script>
  <script src="admin-data.js"></script>
  <script src="admin-members.js"></script>
  <script src="twins-extra.js"></script>
  <script src="admin-requests.js"></script>
  <script>ADM.start();</script>
  <script src="modern.js" defer></script>
</body>
</html>
